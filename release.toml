# cargo-release configuration (https://github.com/crate-ci/cargo-release)
# Driven by .github/workflows/release.yml. Behavior is pinned here so a release
# is deterministic regardless of who/where it runs.

# Only ever release from main.
allow-branch = ["main"]

# Tag as vX.Y.Z (matches the existing tag scheme).
tag-name = "v{{version}}"
tag-message = "Release {{crate_name}} {{version}}"

# Conventional-commit style bump commit.
pre-release-commit-message = "chore: release v{{version}}"

# Publish to crates.io, create the tag, and push the commit + tag.
publish = true
tag = true
push = true

# CI provides identity; don't sign in the runner.
sign-commit = false
sign-tag = false
