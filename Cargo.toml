[package]
name = "spherenet-admin"
version = "0.3.4"
edition = "2021"
repository = "https://github.com/Sphere-Foundation/spherenet-admin"
license = "Apache-2.0"
readme = "README.md"
description = "Command-line tool for SphereNet governance and network administration"
publish = true

[dependencies]
actix-cors = { version = "0.7" }
actix-web = { version = "4" }
base64 = { version = "0.22" }
bincode = { version = "1.3.3" }
borsh = { version = "1.5" }
clap = { version = "4.5", features = ["derive"] }
eyre = { version = "0.6" }
google-cloud-kms-v1 = { version = "1.9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sha2 = { version = "0.10" }
solana-client = { version = "3.1.8" }
solana-commitment-config = { version = "3.0.0" }
solana-bls-signatures = { version = "3.0.0", features = ["solana-signer-derive"] }
solana-keychain = { version = "1.4.0", default-features = false, features = ["gcp_kms", "sdk-v3"] }
solana-sdk = { version = "3.0.0" }
solana-sdk-ids = { version = "3.0.0" }
solana-system-interface = { version = "=2.0", features = ["bincode"] }
solana-vote-interface = { version = "5.0.0", features = ["bincode"] }
spherenet-monetary-policy-client = { version = "0.4.1" }
spherenet-monetary-policy-interface = { version = "0.4.1", features = [ "solana-p" ] }
spherenet-program-whitelist-client = { version = "0.3.1" }
spherenet-program-whitelist-interface = { version = "0.3.1", features = [ "solana-p" ] }
spherenet-stake-interface = { version = "0.5.1", features = ["bincode"] }
spherenet-validator-whitelist-client = { version = "0.5.1" }
spherenet-validator-whitelist-interface = { version = "0.5.1", features = [ "solana-p" ] }
spherenet-loader-v3-interface = { version = "0.3.1", features = ["bincode"] }
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
google-cloud-auth = { version = "1" }
wiremock = { version = "0.6" }

[profile.release]
strip = true
