name: Release

# Manual, one-button release:
#   1. preflight       - fmt / test / build / `cargo publish --dry-run` (guards the irreversible steps)
#   2. release         - `cargo release` bumps the version, publishes to crates.io, tags + pushes
#   3. build           - cross-build the release binaries (Linux x86_64, macOS arm64)
#   4. github-release  - attach the binaries + checksums to a GitHub Release
#
# Prerequisite: repo secret CARGO_REGISTRY_TOKEN (a crates.io API token) must be set.
on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump level (ignored when 'version' is set)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Explicit version, e.g. 1.2.3 or 1.2.3-rc.1 (overrides 'level')"
        type: string
        default: ""
      dry_run:
        description: "Rehearse only - no publish, tag, push, or GitHub Release"
        type: boolean
        default: false

permissions:
  contents: read

# Never let two releases run at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Verify the crate publishes
        run: cargo publish --dry-run --locked

  release:
    name: Bump, publish & tag
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run cargo release
        id: release
        run: |
          set -euo pipefail
          BUMP="${{ inputs.version != '' && inputs.version || inputs.level }}"
          ARGS=("$BUMP")
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            ARGS+=(--execute --no-confirm)
          fi
          echo "Running: cargo release ${ARGS[*]}"
          cargo release "${ARGS[@]}"
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Released version $VERSION (tag v$VERSION)"

  build:
    name: Build ${{ matrix.target }}
    needs: release
    if: ${{ ! inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin="spherenet-admin"
          dist="${bin}-${{ needs.release.outputs.version }}-${{ matrix.target }}"
          mkdir -p "staging/${dist}"
          cp "target/${{ matrix.target }}/release/${bin}" "staging/${dist}/"
          cp README.md LICENSE "staging/${dist}/"
          mkdir -p dist
          tar -czf "dist/${dist}.tar.gz" -C staging "${dist}"
          ( cd dist && shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256" )
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [release, build]
    if: ${{ ! inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
