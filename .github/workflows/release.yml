name: Release

# Manual, one-button release. You own the version: bump `version` in Cargo.toml
# in a normal (reviewed) PR and merge it FIRST. This workflow NEVER edits code,
# commits, or pushes to a branch — it builds both target binaries, publishes the
# crate to crates.io, and cuts a GitHub Release. The only ref it creates is the
# release tag (vX.Y.Z), pointing at the commit you released — not a code change.
#
#   1. preflight       - fmt / clippy / test / `cargo publish --dry-run`, and refuse
#                        if the Cargo.toml version is already on crates.io (forgot to bump)
#   2. build           - cross-build + package both binaries (Linux x86_64, macOS arm64).
#                        Doubles as the compile gate: publish waits on it.
#   3. publish         - `cargo publish` to crates.io  (irreversible; only after 1 & 2)
#   4. github-release  - attest build provenance for each archive, then tag vX.Y.Z at
#                        the released commit + attach binaries + checksums
#
# Version is sourced entirely from Cargo.toml — there is no bump input and no
# cargo-release. No long-lived credential is involved: crates.io is reached via
# Trusted Publishing (OIDC) and the GitHub Release via GITHUB_TOKEN.
#
# Supply-chain posture:
#   - Third-party actions are SHA-pinned; Dependabot keeps the pins current.
#   - The job refuses to run outside Sphere-Foundation/spherenet-admin, so a
#     lookalike org or a fork that copies this file and the secrets cannot cut a
#     release that looks like ours.
#   - Every archive gets a SLSA build-provenance attestation tied to this
#     workflow and commit; operators verify with `gh attestation verify`.
#   - The `.sha256` next to each archive is uploaded by the same job, so it only
#     detects a corrupt download — not an archive swapped by someone with write
#     access; the provenance attestation is what proves where an archive came from.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse only - build + verify, no publish, no tag, no GitHub Release"
        type: boolean
        default: false

permissions:
  contents: read

# Never let two releases run at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # Identity guard: a release must come from this repository on main. A
      # fork or a lookalike org that copies the workflow (the LiteLLM pattern)
      # fails here, before anything is built or published. Dry runs may
      # rehearse from any branch; a real release only from main.
      - name: Refuse to release from another repository or branch
        if: ${{ github.repository != 'Sphere-Foundation/spherenet-admin' || (!inputs.dry_run && github.ref != 'refs/heads/main') }}
        run: |
          echo "::error::release.yml only releases from Sphere-Foundation/spherenet-admin on refs/heads/main (this run: ${{ github.repository }} @ ${{ github.ref }})"
          exit 1
      # Ship gate, not a style gate: fmt/clippy are enforced by ci.yml on every
      # push to main (the exact commit being released), so preflight verifies only
      # what's release-specific — it tests, dry-run-publishes, and (with `build`)
      # proves both targets compile before the irreversible publish.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master, 2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: cargo test --locked
      - name: Verify the crate publishes
        run: cargo publish --dry-run --locked
      - name: Read version from Cargo.toml + guard against re-publish
        id: version
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          echo "Cargo.toml version: $VERSION"
          # Fail early if this version is already on crates.io — the "I forgot to
          # bump Cargo.toml" guard, before anything irreversible runs.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "spherenet-admin-release (github-actions)" \
            "https://crates.io/api/v1/crates/spherenet-admin/${VERSION}")
          if [ "$code" = "200" ]; then
            echo "::error::spherenet-admin ${VERSION} is already published on crates.io — bump the version in Cargo.toml first."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"    >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    # Builds the real release artifacts AND serves as the cross-platform compile
    # gate — `publish` needs this, so a break on either target stops the release
    # before crates.io is touched. No version bump happens anywhere, so what's
    # built here is exactly what ships (correct version embedded from Cargo.toml).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master, 2026-10-16)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin="spherenet-admin"
          dist="${bin}-${{ needs.preflight.outputs.version }}-${{ matrix.target }}"
          mkdir -p "staging/${dist}"
          cp "target/${{ matrix.target }}/release/${bin}" "staging/${dist}/"
          cp README.md LICENSE "staging/${dist}/"
          mkdir -p dist
          tar -czf "dist/${dist}.tar.gz" -C staging "${dist}"
          # Download-integrity check only (`shasum -c`). It travels with the
          # archive, so it is not a defence against a swapped archive — the
          # provenance attestation in `github-release` is.
          ( cd dist && shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256" )
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: [preflight, build]
    if: ${{ ! inputs.dry_run }}
    runs-on: ubuntu-latest
    # Gated behind the `release` environment (main-only + any required reviewers),
    # and authenticated via crates.io Trusted Publishing: no stored API token —
    # GitHub mints a short-lived OIDC token that crates.io exchanges for a 30-min
    # publish token. The crates.io side must be configured to trust owner/repo +
    # workflow `release.yml` + environment `release`.
    environment: release
    permissions:
      contents: read      # checkout
      id-token: write     # required: mint the OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master, 2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub Release
    needs: [preflight, build, publish]
    if: ${{ ! inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the tag + release, upload assets
      id-token: write       # sign the provenance attestation (Sigstore)
      attestations: write   # store it on the repository
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # SLSA build provenance for each archive: a signed statement that this
      # workflow, at this commit, produced an artifact with this digest.
      # Operators check it with
      #   gh attestation verify <archive> -R Sphere-Foundation/spherenet-admin
      # which fails for an archive that was rebuilt elsewhere or swapped after
      # the release — the case the `.sha256` files cannot catch.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
