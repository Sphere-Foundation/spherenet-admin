# Keeps the SHA-pinned actions in .github/workflows current (Dependabot
# rewrites the SHA and the trailing `# vX.Y.Z` comment together) and surfaces
# Cargo advisories as PRs instead of only as alerts.
#
# `cooldown`: a release must be at least 7 days old before Dependabot proposes
# it, so a compromised or yanked release has time to be caught upstream first.
# Security updates are not delayed by the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Lockfile-only bumps; a semver-major bump of a direct dependency is a
    # deliberate change, not a Dependabot PR.
    versioning-strategy: lockfile-only
